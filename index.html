
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Eventos</title>

  <style>
    body {
      background: #0b1120;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: #00ffff;
    }

    #contador {
      font-size: 70px;
      margin: 30px;
      color: #00ff99;
    }

    button {
      background: #00ffff;
      color: #08111f;
      border: none;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #00ff99;
      box-shadow: 0 0 15px #00ff99;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      background: #172238;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1 id="titulo">Mi Evento</h1>

  <input
    type="text"
    id="nuevoTitulo"
    placeholder="Escribe el nombre del evento"
    oninput="cambiarTitulo()"
  >

  <div id="contador">0</div>

  <button onclick="aumentar()">+1</button>
  <button onclick="disminuir()">-1</button>
  <button onclick="reiniciar()">Reiniciar Contador</button>

  <script>
    let contador = 0;

    function actualizarContador() {
      document.getElementById("contador").textContent = contador;
    }

    function aumentar() {
      contador++;
      actualizarContador();
    }

    function disminuir() {
      contador--;
      actualizarContador();
    }

    function reiniciar() {
      contador = 0;
      actualizarContador();
    }

    function cambiarTitulo() {
      let texto = document.getElementById("nuevoTitulo").value;
      document.getElementById("titulo").textContent = texto || "Mi Evento";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Eventos - Colegio Bolívar</title>

  <link rel="stylesheet" href="style.css">
  <script src="actions.js" defer></script>
</head>

<body>
  <main class="container">
    <h1 id="titulo">Contador de Eventos</h1>
    <p class="subtitle">Colegio Bolívar</p>

    <label for="nuevoTitulo">Cambiar título:</label>
    <input
      type="text"
      id="nuevoTitulo"
      placeholder="Escribe un nuevo título"
    >

    <section class="counter">
      <h2>Eventos registrados</h2>
      <p id="contador" aria-live="polite">0</p>
    </section>

    <div class="buttons">
      <button id="sumar">+ Agregar evento</button>
      <button id="restar">- Quitar evento</button>
      <button id="reiniciar">Reiniciar</button>
    </div>
  </main>
</body>
</html>
