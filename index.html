
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Counter V7</title>
  <link rel="stylesheet" href="style.css">
  <script src="actions.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Click Counter</h1>
    <p>¡Consigue el mejor puntaje!</p>

    <label for="username">Nombre del jugador</label>
    <input id="username" type="text"
      maxlength="30" placeholder="Tu nombre">

    <label for="duration">Duración</label>
    <select id="duration">
      <option value="10">10 segundos</option>
      <option value="20">20 segundos</option>
      <option value="30">30 segundos</option>
    </select>

    <div class="stats">
      <div>
        <span>Tiempo</span>
        <h2 id="timer">0.000 s</h2>
      </div>
      <div>
        <span>Clicks</span>
        <h2 id="counter">0</h2>
      </div>
    </div>

    <button id="startBtn">Iniciar partida</button>
    <button id="clickBtn" disabled>¡CLICK!</button>
    <button id="resetBtn">Reiniciar</button>
    <button id="rankingBtn">🏆 Leaderboard</button>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="leaderboard" class="hidden">
      <h2>🏆 Tabla de posiciones</h2>

      <label for="rankingDuration">Categoría</label>
      <select id="rankingDuration">
        <option value="10">10 segundos</option>
        <option value="20">20 segundos</option>
        <option value="30">30 segundos</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Jugador</th>
            <th>Clicks</th>
          </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
